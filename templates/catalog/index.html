<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
    <div><a href="/static">MyShop</a></div>
    <div><a href="/login">Вход</a></div>
</nav>

<div class="container">
    <h1>Каталог товаров</h1>

    <div id="api-error" class="error-box hidden"></div>

    <div id="products-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
        <!-- Товары будут здесь -->
    </div>
</div>

<script>
    async function loadProducts() {
        const grid = document.getElementById('products-grid');
        const errBlock = document.getElementById('api-error');

        try {
            // Имитация запроса к API каталога
            // const res = await fetch('/api/products');
            // if (!res.ok) throw new Error("Сервис каталога недоступен");

            // Демо-данные
            const products = [
                { id: 1, name: "Товар 1", price: 1000 },
                { id: 2, name: "Товар 2", price: 2000 },
            ];

            grid.innerHTML = products.map(p => `
                    <div class="card">
                        <h3>${p.name}</h3>
                        <p>${p.price} ₽</p>
                        <button class="btn btn-primary" onclick="alert('Добавлено в корзину')">Купить</button>
                    </div>
                `).join('');

        } catch (error) {
            errBlock.classList.remove('hidden');
            errBlock.innerText = "Ошибка загрузки каталога: " + error.message;
        }
    }
    loadProducts();
</script>
</body>
</html>
