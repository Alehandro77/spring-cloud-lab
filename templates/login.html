<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="max-width: 400px; margin-top: 50px;">
    <div class="card">
        <h2>Вход в систему</h2>

        <!-- Контейнер для ошибок -->
        <div id="error-msg" class="error-box hidden"></div>

        <form id="login-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
        </form>
        <p style="text-align: center; margin-top: 10px;">
            Нет аккаунта? <a href="/register">Регистрация</a>
        </p>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errBlock = document.getElementById('error-msg');
        errBlock.classList.add('hidden');

        const data = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        try {
            // Пример запроса
            // const res = await fetch('/api/login', { method: 'POST', body: JSON.stringify(data) });

            // Имитация: если пароль неверный
            if (data.password !== '123456') {
                throw new Error("Неверный логин или пароль");
            }

            alert("Успешный вход!");
            window.location.href = "/admin/dashboard";
        } catch (error) {
            errBlock.classList.remove('hidden');
            errBlock.innerText = error.message;
        }
    });
</script>
</body>
</html>
