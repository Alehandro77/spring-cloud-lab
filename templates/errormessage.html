<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container" style="text-align: center; margin-top: 100px;">
    <h1 style="font-size: 80px; color: #dc3545;">⚠️</h1>
    <h2 id="error-title">Ошибка сервера</h2>
    <p id="error-desc">Что-то пошло не так. Микросервис не отвечает или вернул ошибку.</p>

    <a href="/" class="btn btn-primary">На главную</a>
</div>

<script>
    // Получаем код ошибки из URL (например, ?code=403)
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');

    const title = document.getElementById('error-title');
    const desc = document.getElementById('error-desc');

    if (code === '403') {
        title.innerText = "Доступ запрещен";
        desc.innerText = "У вас нет прав для просмотра этой страницы. (Только для администраторов)";
    } else if (code === '503') {
        title.innerText = "Сервис недоступен";
        desc.innerText = "Микросервис, к которому вы обращаетесь, временно отключен. Попробуйте позже.";
    } else if (code === '404') {
        title.innerText = "Страница не найдена";
        desc.innerText = "Такой страницы не существует.";
    }
</script>
</body>
</html>
