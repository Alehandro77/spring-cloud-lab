<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | louie Biton</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div th:replace="~{header :: header}"></div>

<div class="auth-wrapper">
    <div class="auth-card">
        <h2>С возвращением!</h2>
        <p class="auth-subtitle">Войдите в свой аккаунт</p>

        <!-- Вывод ошибки от контроллера -->
        <div th:if="${error}" class="error-box">
            <strong>Ошибка:</strong> <span th:text="${error}"></span>
        </div>

        <!-- Форма отправляет POST на /login -->
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>

        <div class="auth-footer">
            Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a>
        </div>
    </div>
</div>
</body>
</html>
