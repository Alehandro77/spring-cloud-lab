<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Каталог</title></head>
<body>
<h1>Каталог товаров</h1>
<a href="/">На главную</a> |
<a href="/cart">Корзина</a> |
<a href="/orders">Мои заказы</a>

<div th:if="${error}" style="color: red; padding: 10px; border: 1px solid red; margin: 10px 0;">
    <b>Ошибка:</b> <span th:text="${error}"></span>
</div>

<table border="1">
    <thead>
    <tr><th>ID</th><th>Название</th><th>Цена</th><th>Бренд</th><th>Категория</th><th>Действия</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.brand}"></td>
        <td th:text="${p.category}"></td>
        <td>
            <a th:href="@{/product/{id}(id=${p.id})}">Открыть</a>
            <form method="post" action="/cart/add" style="display:inline">
                <input type="hidden" name="productId" th:value="${p.id}">
                <input type="number" name="quantity" value="1" min="1" style="width: 50px;">
                <button type="submit">В корзину</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
