<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои заказы | louie Biton</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div th:replace="~{header :: header}"></div>

<main class="container">
  <div class="hero-low" style="margin-top: 40px;">
    <h1>Мои заказы</h1>
    <p>История ваших покупок.</p>
  </div>

  <div th:if="${error}" class="error-box">
    <strong>Ошибка:</strong> <span th:text="${error}"></span>
  </div>

  <div th:if="${orders == null or orders.empty}"
       style="text-align: center; margin-top: 60px; background: rgba(255,255,255,0.6); padding: 50px; border-radius: 20px;">
    <h2 style="font-size: 32px; margin-bottom: 15px;">У вас пока нет заказов</h2>
    <p style="color: #666; margin-bottom: 30px;">Самое время выбрать что-то классное в каталоге!</p>
    <a th:href="@{/catalog}" class="btn btn-primary">Перейти в каталог</a>
  </div>

  <div class="orders-list" th:if="${orders != null and !orders.empty}">

    <div class="order-card" th:each="order : ${orders}">

      <div class="order-header">
        <div>
          <h3>Заказ №<span th:text="${order.id}"></span></h3>
          <p class="order-date">
            от <span th:text="${#strings.replace(#strings.substring(order.createdAt, 0, 16), 'T', ' ')}">2026-11-06 12:38</span>
          </p>
        </div>
      </div>

      <div class="order-items">
        <div class="order-item" th:each="item : ${order.items}">
          <div class="item-info">
            <span class="item-name" th:text="${item.productName}">Название товара</span>
            <span class="item-qty" th:text="'× ' + ${item.quantity}">× 1</span>
          </div>
          <div class="item-price" th:text="${item.price} + ' ₽'">0 ₽</div>
        </div>
      </div>

      <div class="order-footer">
        <span class="total-label">Итого к оплате:</span>
        <span class="total-amount">
                    <span th:text="${order.totalPrice}">0</span> ₽
                </span>
      </div>

    </div>
  </div>
</main>
</body>
</html>
