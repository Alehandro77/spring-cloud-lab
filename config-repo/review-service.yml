server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/review_db
    username: review_user
    password: review_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: "change-me-to-a-very-long-random-string-at-least-32-chars-long-please"