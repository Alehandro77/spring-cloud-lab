server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/review-db
    username: review_user
    password: review_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs